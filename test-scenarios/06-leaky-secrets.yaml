# Scenario 6 — a crashing app that leaks credentials into its error logs.
#
# Tests evidence redaction, not diagnosis quality. Every secret sits ON an
# error line, because that is how real apps leak them ("error connecting to
# postgres://user:password@...") -- and because the log collector keeps only
# failure-looking lines, a secret on a harmless line would be dropped before
# redaction ever saw it, and the test would prove nothing.
#
# Expect: the agent still diagnoses the crash, the investigation's
# `redactions.total` is > 0, and none of the secret values appear in the
# stored investigation or the prompt sent to the LLM.
#
#   kubectl create namespace failure-lab
#   kubectl apply -f test-scenarios/06-leaky-secrets.yaml
#   ...investigate; log lines show [REDACTED:...] markers...
#   kubectl delete -f test-scenarios/06-leaky-secrets.yaml
#
# All values below are fake and exist only to be redacted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: failure-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "starting orders-api"
              echo "ERROR: cannot connect to postgres://orders:hunter2secret@db.prod.internal:5432/orders: connection refused"
              echo "ERROR: auth failed for session token eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJvcmRlcnMtYXBpIn0.c2lnbmF0dXJlLWZha2U"
              echo "FATAL: payment client invalid config PAYMENTS_API_KEY=sk-proj-fakefakefakefakefake1234"
              exit 1
